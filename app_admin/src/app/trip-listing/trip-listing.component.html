<div class="row">
  <div class="col-12 mb-3">
    <a *ngIf="isLoggedIn()" routerLink="/add-trip" class="btn btn-primary">Add Trip</a>
  </div>
  @for (trip of trips(); track trip.code) {
    <div class="col-md-4">
      <app-trip-card [trip]="trip" (deleteTrip)="onDeleteTrip($event)"></app-trip-card>
    </div>
  }
</div>
