<div class="card mb-4">
  <div class="card-body">
    <h5 class="card-title">{{ trip.name }}</h5>
    <h6 class="card-subtitle mb-2 text-muted">{{ trip.resort }}</h6>
    <p class="card-text">{{ trip.description }}</p>
    <p class="card-text"><strong>{{ trip.length }}</strong> starting {{ trip.start }}</p>
    <p class="card-text">${{ trip.perPerson }} per person</p>
    <a [routerLink]="['/edit-trip', trip.code]" class="btn btn-secondary">Edit</a>
    <button type="button" class="btn btn-danger" (click)="onDelete()">Delete</button>
  </div>
</div>
